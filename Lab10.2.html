<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider with Text</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .slider {
            width: 800px;
            height: 450px;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
        }

        .slide {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text placed above the image */
        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;

            /* z-index places text above image */
            z-index: 2;
        }

        .text h1 {
            font-size: 50px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 5px black;
        }

        .text p {
            font-size: 22px;
            text-shadow: 2px 2px 5px black;
        }

        /* Dark overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);

            /* Overlay is above image but below text */
            z-index: 1;
        }

        /* Slider buttons */
        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px;
            font-size: 25px;
            cursor: pointer;

            z-index: 3;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover,
        .next:hover {
            background-color: palevioletred;
        }
    </style>
</head>

<body>

    <div class="slider">

        <div class="slide">
            <img src="https://mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt="Bila">
            
            <div class="overlay"></div>

            <div class="text">
                <h1>Beautiful Mountains</h1>
                <p>Explore the beauty of nature</p>
            </div>
        </div>

        <button class="prev" onclick="previousSlide()">❮</button>
        <button class="next" onclick="nextSlide()">❯</button>

    </div>

    <script>
        let images = [
            {
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4XTHz6tPhsXpFHqUsIxHoRIRPJJlAQ2Og4v5B1yv0_w5npFyfx0J-66GQ&s=10",
                title: "danger Bila",
                description: "Explore the beauty of nature"
            },
            {
                image: "https://gratisography.com/wp-content/uploads/2024/10/gratisography-cool-cat-800x525.jpg",
                title: "kala Bila",
                description: "Enjoy peaceful moments"
            },
            {
                image: "https://img.magnific.com/free-photo/surreal-neon-tropical-flowers_23-2151665779.jpg?semt=ais_hybrid&w=740&q=80",
                title: "colors",
                description: "Discover the world around you"
            }
        ];

        let currentSlide = 0;

        function showSlide() {
            document.querySelector(".slide img").src = images[currentSlide].image;
            document.querySelector(".text h1").textContent = images[currentSlide].title;
            document.querySelector(".text p").textContent = images[currentSlide].description;
        }

        function nextSlide() {
            currentSlide++;

            if (currentSlide >= images.length) {
                currentSlide = 0;
            }

            showSlide();
        }

        function previousSlide() {
            currentSlide--;

            if (currentSlide < 0) {
                currentSlide = images.length - 1;
            }

            showSlide();
        }

        // Automatic slider
        setInterval(nextSlide, 3000);
    </script>

</body>
</html>
