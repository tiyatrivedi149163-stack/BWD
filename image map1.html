<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagemap1</title>
</head>
<body>
 <h2>Rectangle image map</h2>
    <img src="img 1.jpg" width="600" height="400"
    usemap="#rectmap">
    
    <map name="rectmap">
        <area shape="rect" coords="50,50,250,200"
        href="download.jpg"
        target="blank">
    </map>
    
</body>
</html>
