<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Example </title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
            top: 100px;
            left: 100px;
            z-index: 1;
        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: purple;
            position: absolute;
            top: 150px;
            left: 150px;
            z-index: 2;
        }
        .box3{
            width: 200px;
            height: 200px;
            background-color: rgb(220, 53, 109);
            position: absolute;
            top: 200px;
            left: 200px;
            z-index: 3
        }        
    </style>
</head>
<body>
    <h1>z-index example</h1>
    
    <div class="box1">Red Box</div>
    <div class="box2">purple Box</div>
    <div class="box3">rgb Box</div>
</body>
</html>
