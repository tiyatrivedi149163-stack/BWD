<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Student Details</h2>

    <!-- Header Row -->
    <div class="row bg-dark text-white fw-bold p-2">
        <div class="col-3">ID</div>
        <div class="col-3">Name</div>
        <div class="col-3">Course</div>
        <div class="col-3">Marks</div>
    </div>

    <!-- Row 1 -->
    <div class="row border p-2">
        <div class="col-3">1</div>
        <div class="col-3">Rahul</div>
        <div class="col-3">BCA</div>
        <div class="col-3">85</div>
    </div>

    <!-- Row 2 -->
    <div class="row border p-2 bg-light">
        <div class="col-3">2</div>
        <div class="col-3">Priya</div>
        <div class="col-3">BCA</div>
        <div class="col-3">90</div>
    </div>

    <!-- Row 3 -->
    <div class="row border p-2">
        <div class="col-3">3</div>
        <div class="col-3">Amit</div>
        <div class="col-3">BBA</div>
        <div class="col-3">78</div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
